services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, internal]

  volume-init:
    build: .
    user: "0:0"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/app/scripts/init-volumes.sh"]
    volumes:
      - artifacts:/var/lib/amarktai-earn/artifacts
      - job_data:/var/lib/amarktai-earn/jobs
      - repo_cache:/var/lib/amarktai-earn/repos
      - app_cache:/var/lib/amarktai-earn/cache
      - backups:/var/lib/amarktai-earn/backups
      - logs:/var/lib/amarktai-earn/logs
      - uploads:/var/lib/amarktai-earn/uploads
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command: /app/scripts/start-web.sh
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 120s
    volumes:
      - artifacts:/var/lib/amarktai-earn/artifacts
      - job_data:/var/lib/amarktai-earn/jobs
      - repo_cache:/var/lib/amarktai-earn/repos
      - app_cache:/var/lib/amarktai-earn/cache
      - backups:/var/lib/amarktai-earn/backups
      - logs:/var/lib/amarktai-earn/logs
      - uploads:/var/lib/amarktai-earn/uploads
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command: sh -lc 'python manage.py production_check && exec python manage.py run_rq_worker'
    volumes:
      - artifacts:/var/lib/amarktai-earn/artifacts
      - job_data:/var/lib/amarktai-earn/jobs
      - repo_cache:/var/lib/amarktai-earn/repos
      - app_cache:/var/lib/amarktai-earn/cache
      - logs:/var/lib/amarktai-earn/logs
      - uploads:/var/lib/amarktai-earn/uploads
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  watcher:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command: sh -lc 'python manage.py production_check && exec python manage.py run_revenue_watcher'
    volumes:
      - job_data:/var/lib/amarktai-earn/jobs
      - repo_cache:/var/lib/amarktai-earn/repos
      - uploads:/var/lib/amarktai-earn/uploads
      - logs:/var/lib/amarktai-earn/logs
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  watchdog:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command: sh -lc 'python manage.py production_check && exec python manage.py run_watchdog'
    volumes:
      - job_data:/var/lib/amarktai-earn/jobs
      - repo_cache:/var/lib/amarktai-earn/repos
      - app_cache:/var/lib/amarktai-earn/cache
      - logs:/var/lib/amarktai-earn/logs
      - uploads:/var/lib/amarktai-earn/uploads
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-broker:
        condition: service_started
    networks: [internal]

  genx-proxy:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command: sh -lc 'python manage.py production_check && exec python manage.py run_sandbox_genx_proxy'
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, sandbox_llm]

  sandbox-broker:
    build:
      context: .
      dockerfile: sandbox/broker.Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file: .env
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      volume-init:
        condition: service_completed_successfully
    networks: [internal]

  sandbox-agent-image:
    image: amarktai-earn-sandbox:phase8c
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    profiles: ["sandbox-build"]
    command: ["/bin/true"]
    networks: [sandbox_llm]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  edge: {}
  internal: {}
  sandbox_llm:
    name: amarktai_sandbox_llm
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  artifacts: {}
  job_data: {}
  repo_cache:
    name: amarktai_repo_cache
  app_cache: {}
  backups: {}
  logs: {}
  uploads: {}
