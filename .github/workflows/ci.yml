name: Amarktai Earn CI

on:
  pull_request:
    branches: [main, phase2-3/ready-for-keys]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  AMARKTAI_ENV: test
  DJANGO_SECRET_KEY: ci-django-secret-key-not-production-2026
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DJANGO_CSRF_TRUSTED_ORIGINS: http://testserver
  DJANGO_DB_ENGINE: postgres
  POSTGRES_DB: amarktai_earn_ci
  POSTGRES_USER: amarktai_ci
  POSTGRES_PASSWORD: ci-postgres-password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://127.0.0.1:6379/0
  COOKIE_SECURE: "0"
  JWT_ISSUER: amarktai-earn-ci
  JWT_AUDIENCE: amarktai-earn-owner-ci
  JWT_ACTIVE_KID: v1
  JWT_SIGNING_KEYS_JSON: '{"v1":"ci-signing-key-with-more-than-sixty-four-characters-000000000000000000"}'
  FIELD_ENCRYPTION_ACTIVE_KID: v1
  FIELD_ENCRYPTION_KEYS_JSON: '{"v1":"MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="}'
  AUTH_THROTTLE_PEPPER: ci-auth-throttle-pepper-with-more-than-thirty-two-characters
  AGENTGIGS_WEBHOOK_SECRET: integration-webhook-secret
  AUTONOMOUS_MODE: OFF
  AGENTGIGS_AUTO_APPLY_ENABLED: "0"
  AMARKTAI_MIN_FREE_DISK_BYTES: "1"
  AMARKTAI_MIN_FREE_DISK_PERCENT: "0"
  AMARKTAI_MIN_MEMORY_HEADROOM_BYTES: "1"
  AMARKTAI_LARGE_JOB_MEMORY_HEADROOM_BYTES: "1"
  AMARKTAI_MAX_LOAD_PER_CPU: "100"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amarktai_earn_ci
          POSTGRES_USER: amarktai_ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarktai_ci -d amarktai_earn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-prod.txt
      - name: Install responsive browser test runtime
        run: python -m pip install 'playwright>=1.54,<2' && python -m playwright install --with-deps chromium
      - run: python -m compileall -q .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - name: Bootstrap canonical launch catalog
        run: python manage.py bootstrap_launch_commercial
      - run: python manage.py healthcheck
      - name: Prove canonical registered operation contracts
        run: python manage.py prove_registered_operations --format json --fail-on FAIL
      - run: python -m unittest discover -s tests -p 'test_*_stdlib.py' -q
      - name: Phase 1 execution engine dynamic acceptance
        run: >-
          python manage.py test
          tests.test_phase0_genx_recovery_contract
          tests.test_failed_workplan_retry_integration
          tests.test_genx_async_session_integration
          tests.test_genx_web_search_negotiation
          tests.test_rq_queueing_integration
          tests.test_phase1_execution_engine_integration
          -v 2
      - name: Phase 1 execution engine structural gate
        run: python manage.py phase1_acceptance --format json --fail-on FAIL
      - name: Phase 2 capability fixture acceptance
        run: >-
          python manage.py test
          tests.test_phase2_capability_factory_integration
          tests.test_phase2_ocr_browser_integration
          -v 2
      - name: Phase 2 canonical capability gate
        run: python manage.py phase2_acceptance --format json --fail-on FAIL
      - name: Phase 3 composition and self-improvement boundary
        run: python manage.py test tests.test_phase3_ready_for_keys_integration -v 2
      - name: Commercial API and profitability launch integration
        run: >-
          python manage.py test
          tests.test_commercial_api_launch_integration
          tests.test_commercial_intelligence_integration
          tests.test_launch_ui_acceptance_integration
          -v 2
      - name: Responsive Chromium structural proof
        env:
          AMARKTAI_RESPONSIVE_ARTIFACT_DIR: test-artifacts/responsive
        run: python manage.py test tests.test_launch_responsive_playwright -v 2
      - name: Upload responsive viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-viewport-evidence
          path: test-artifacts/responsive
          if-no-files-found: warn
      - name: Webdock host compliance integration
        run: python manage.py test tests.test_webdock_host_compliance_integration -v 2
      - name: Priority pricing onboarding publication integration
        run: >-
          python manage.py test
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_commercial_pricing_is_distinct_from_draft_catalog_price_and_fail_closed
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_owner_price_override_cannot_undercut_launch_minimum_and_survives_bootstrap
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_onboarding_survives_static_catalog_refresh_without_touching_payout_truth
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_publication_is_banking_gated_then_records_owner_remote_evidence
          -v 2
      - name: Priority manual and RapidAPI integration
        if: always()
        run: >-
          python manage.py test
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_manual_mode_allows_owner_acceptance_but_never_auto_accepts
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_rapidapi_proxy_auth_idempotency_and_inline_asset_ingress
          -v 2
      - name: Priority Contra Lemon and owner API integration
        if: always()
        run: >-
          python manage.py test
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_signed_buyer_intake_completes_missing_contra_dataset
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_lemon_subscription_maps_initial_order_and_creates_only_paid_renewal_cycles
          tests.test_channel_completion_integration.ChannelCompletionIntegrationTests.test_new_owner_control_apis_are_owner_only
          -v 2
      - name: Priority channel regression integration
        if: always()
        run: python manage.py test tests.test_channel_completion_regressions_integration -v 2
      - name: Full Django integration matrix
        run: python manage.py test tests.test_django_integration tests.test_workplan_integration tests.test_agentgigs_asset_integration tests.test_ops_dashboard_integration tests.test_phase8b_agents_integration tests.test_phase8c_coding_integration tests.test_operations_governor_integration tests.test_security_preflight_integration tests.test_dependency_media_integration tests.test_v1_acceptance_integration tests.test_profit_brain_integration tests.test_multifile_composite_integration tests.test_expanded_workers_integration tests.test_multi_market_adapters_integration tests.test_synthetic_safety_integration tests.test_final_freeze_integration tests.test_owner_ui_integration tests.test_owner_dashboard_final_integration tests.test_frontend_owner_console_integration tests.test_genx_async_session_integration tests.test_genx_web_search_negotiation tests.test_two_sided_revenue_integration tests.test_banking_integration tests.test_phase5_market_readiness_integration tests.test_phase3_channels_integration tests.test_channel_completion_integration tests.test_channel_completion_regressions_integration tests.test_webdock_host_compliance_integration tests.test_rq_queueing_integration tests.test_phase1_execution_engine_integration tests.test_phase2_capability_factory_integration tests.test_phase2_ocr_browser_integration tests.test_phase3_ready_for_keys_integration -v 2
      - name: Production configuration preflight
        env:
          AMARKTAI_ENV: production
          DJANGO_SECRET_KEY: ci-production-django-secret-key-with-more-than-fifty-random-characters-2026
          DJANGO_ALLOWED_HOSTS: earn.amarktai.co.za
          DJANGO_CSRF_TRUSTED_ORIGINS: https://earn.amarktai.co.za
          COOKIE_SECURE: "1"
          POSTGRES_PASSWORD: ci-production-postgres-password-2026
          BACKUP_PASSPHRASE: ci-production-backup-passphrase-with-more-than-thirty-two-characters
          AUTONOMOUS_MODE: OFF
        run: python manage.py production_check
      - name: Compose configuration parses
        env:
          CADDY_EMAIL: ci@example.test
        run: cp .env.example .env && docker compose config --quiet
      - name: Build coding sandbox images and prove isolation surface
        run: |
          docker build -t amarktai-earn-sandbox:phase8c -f sandbox/Dockerfile .
          docker build -t amarktai-earn-sandbox-broker:phase8c -f sandbox/broker.Dockerfile .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 64 --memory 512m --cpus 0.5 --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --tmpfs /home/sandbox:rw,nosuid,nodev,size=64m \
            amarktai-earn-sandbox:phase8c /bin/bash -lc 'test "$(id -u)" = 10001 && test ! -e /var/run/docker.sock && aider --version && aider --help >/dev/null && openhands --help >/dev/null'
          test "$(docker image inspect -f '{{.Config.User}}' amarktai-earn-sandbox-broker:phase8c)" = "10002:10002"
          socket_gid=$(stat -c '%g' /var/run/docker.sock)
          docker run --rm --group-add "$socket_gid" -v /var/run/docker.sock:/var/run/docker.sock \
            -e SANDBOX_AGENT_IMAGE=amarktai-earn-sandbox:phase8c \
            -e SANDBOX_REPOSITORY_VOLUME=amarktai_dependency_smoke_${GITHUB_RUN_ID} \
            amarktai-earn-sandbox-broker:phase8c python /app/scripts/dependency-prep-smoke.py
      - name: Build Apify browser Actor and prove off-host browser runtime
        run: |
          docker build -t amarktai-earn-apify-browser-ci -f integrations/apify_actor/.actor/Dockerfile integrations/apify_actor
          test "$(docker image inspect -f '{{.Config.User}}' amarktai-earn-apify-browser-ci)" = "10001:10001"
          docker run --rm --entrypoint python amarktai-earn-apify-browser-ci -c 'from playwright.async_api import async_playwright; import src.main; print("APIFY_BROWSER_IMPORT_OK")'
      - name: Build production image and prove secrets are excluded
        run: |
          docker build -t amarktai-earn-ci .
          docker run --rm amarktai-earn-ci sh -lc 'test ! -e /app/.env && command -v pg_dump && command -v pg_restore && command -v gpg && command -v ffmpeg && command -v ffprobe && command -v tesseract && command -v pdftoppm'
          docker run --rm amarktai-earn-ci python /app/scripts/media-smoke.py
      - name: Encrypted PostgreSQL backup and restore proof
        run: |
          set -euo pipefail
          volume=amarktai_ci_backups_${GITHUB_RUN_ID}
          restore_db=amarktai_restore_ci
          cleanup() {
            docker run --rm --network host -e PGPASSWORD=ci-postgres-password postgres:17-alpine \
              psql -h 127.0.0.1 -U amarktai_ci -d postgres -c "DROP DATABASE IF EXISTS ${restore_db};" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user 0:0 \
            -v "$volume":/var/lib/amarktai-earn/backups \
            amarktai-earn-ci /app/scripts/init-volumes.sh
          docker run --rm --network host \
            -e POSTGRES_DB=amarktai_earn_ci \
            -e POSTGRES_USER=amarktai_ci \
            -e POSTGRES_PASSWORD=ci-postgres-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e BACKUP_PASSPHRASE=ci-backup-passphrase-with-more-than-thirty-two-characters \
            -v "$volume":/var/lib/amarktai-earn/backups \
            amarktai-earn-ci /app/scripts/backup.sh
          docker run --rm --network host -e PGPASSWORD=ci-postgres-password postgres:17-alpine \
            psql -h 127.0.0.1 -U amarktai_ci -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS ${restore_db};" -c "CREATE DATABASE ${restore_db};"
          docker run --rm --network host \
            -e POSTGRES_DB="$restore_db" \
            -e POSTGRES_USER=amarktai_ci \
            -e POSTGRES_PASSWORD=ci-postgres-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e BACKUP_PASSPHRASE=ci-backup-passphrase-with-more-than-thirty-two-characters \
            -v "$volume":/var/lib/amarktai-earn/backups \
            amarktai-earn-ci sh -lc 'latest=$(ls -1t /var/lib/amarktai-earn/backups/*.dump.gpg | head -1); exec /app/scripts/restore.sh "$latest"'
          count=$(docker run --rm --network host -e PGPASSWORD=ci-postgres-password postgres:17-alpine \
            psql -h 127.0.0.1 -U amarktai_ci -d "$restore_db" -Atc 'SELECT COUNT(*) FROM django_migrations;')
          test "$count" -gt 0
      - name: Final V1 acceptance report
        run: python manage.py v1_acceptance --format json --ci-proven --fail-on FAIL
      - name: Final Phase 3 ready-for-keys report
        run: python manage.py phase3_acceptance --format json --ci-proven --fail-on FAIL
      - name: Final launch acceptance report
        run: python manage.py launch_acceptance --format json --ci-proven --fail-on FAIL
