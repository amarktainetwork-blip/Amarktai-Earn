name: Amarktai Earn Compatibility Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  AMARKTAI_ENV: test
  DJANGO_SECRET_KEY: ci-django-secret-key-not-production-2026
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DJANGO_CSRF_TRUSTED_ORIGINS: http://testserver
  DJANGO_DB_ENGINE: postgres
  POSTGRES_DB: amarktai_earn_ci
  POSTGRES_USER: amarktai_ci
  POSTGRES_PASSWORD: ci-postgres-password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://127.0.0.1:6379/0
  COOKIE_SECURE: "0"
  JWT_ISSUER: amarktai-earn-ci
  JWT_AUDIENCE: amarktai-earn-owner-ci
  JWT_ACTIVE_KID: v1
  JWT_SIGNING_KEYS_JSON: '{"v1":"ci-signing-key-with-more-than-sixty-four-characters-000000000000000000"}'
  FIELD_ENCRYPTION_ACTIVE_KID: v1
  FIELD_ENCRYPTION_KEYS_JSON: '{"v1":"MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="}'
  AUTH_THROTTLE_PEPPER: ci-auth-throttle-pepper-with-more-than-thirty-two-characters
  AGENTGIGS_WEBHOOK_SECRET: integration-webhook-secret
  AUTONOMOUS_MODE: OFF
  AGENTGIGS_AUTO_APPLY_ENABLED: "0"
  AMARKTAI_MIN_FREE_DISK_BYTES: "1"
  AMARKTAI_MIN_FREE_DISK_PERCENT: "0"
  AMARKTAI_MIN_MEMORY_HEADROOM_BYTES: "1"
  AMARKTAI_LARGE_JOB_MEMORY_HEADROOM_BYTES: "1"
  AMARKTAI_MAX_LOAD_PER_CPU: "100"

jobs:
  legacy-module:
    name: legacy ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        module:
          - tests.test_django_integration
          - tests.test_workplan_integration
          - tests.test_ops_dashboard_integration
          - tests.test_phase8b_agents_integration
          - tests.test_operations_governor_integration
          - tests.test_security_preflight_integration
          - tests.test_dependency_media_integration
          - tests.test_v1_acceptance_integration
          - tests.test_profit_brain_integration
          - tests.test_multifile_composite_integration
          - tests.test_expanded_workers_integration
          - tests.test_final_freeze_integration
          - tests.test_owner_ui_integration
          - tests.test_owner_dashboard_final_integration
          - tests.test_frontend_owner_console_integration
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amarktai_earn_ci
          POSTGRES_USER: amarktai_ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarktai_ci -d amarktai_earn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-prod.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test ${{ matrix.module }} -v 2
