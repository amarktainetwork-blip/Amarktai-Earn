<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amarktai Earn</title><style>body{margin:0;background:#090d12;color:#e9edf2;font:14px system-ui}.shell{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800;letter-spacing:.06em}.status{background:#17211d;border:1px solid #284b38;padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:24px}.card{background:#11161d;border:1px solid #222c38;border-radius:14px;padding:18px}.k{color:#8492a4;font-size:12px}.v{font-size:25px;font-weight:750;margin-top:6px}.note{color:#788697;margin-top:22px}</style></head><body><main class="shell"><div class="top"><div><div class="brand">AMARKTAI EARN</div><div>Autonomous Economic Operations</div></div><div class="status" id="mode">SYSTEM</div></div><div class="grid"><div class="card"><div class="k">NET EARNED TODAY</div><div class="v" id="earned">—</div></div><div class="card"><div class="k">SETTLED TODAY</div><div class="v" id="settled">—</div></div><div class="card"><div class="k">PENDING PAYOUT</div><div class="v" id="pending">—</div></div><div class="card"><div class="k">ACTIVE PAID JOBS</div><div class="v" id="jobs">—</div></div><div class="card"><div class="k">ACTIVE AGENTS</div><div class="v" id="agents">—</div></div><div class="card"><div class="k">GENX BALANCE</div><div class="v" id="genxBalance">—</div></div><div class="card"><div class="k">GENX USED TODAY</div><div class="v" id="genxUsed">—</div></div></div><div class="note" id="truth"></div></main><script>fetch('/api/overview',{credentials:'same-origin'}).then(async r=>{if(r.status===401){location='/login/';return}let d=await r.json();mode.textContent='AUTONOMOUS '+d.autonomous_mode;earned.textContent='$'+d.net_earned_today;settled.textContent='$'+d.settled_today;pending.textContent='$'+d.pending_payout;jobs.textContent=d.active_paid_jobs;agents.textContent=d.active_agents;genxBalance.textContent=d.genx_balance===null?'—':d.genx_balance+' cr';genxUsed.textContent=d.genx_used_today+' cr';truth.textContent=d.revenue_truth})</script></body></html>
