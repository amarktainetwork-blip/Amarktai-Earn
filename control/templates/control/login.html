<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amarktai Earn — Secure Owner Access</title>
<style>body{margin:0;background:#0a0d12;color:#eef2f7;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.wrap{width:min(430px,92vw)}.brand{font-size:28px;font-weight:800;letter-spacing:.08em}.sub{color:#8c98a8;margin:7px 0 26px}.card{background:#11161e;border:1px solid #242d3a;border-radius:16px;padding:28px;box-shadow:0 24px 70px #0008}label{display:block;color:#9ba8b8;margin:14px 0 7px}input{width:100%;box-sizing:border-box;background:#0b1017;border:1px solid #2a3544;color:white;border-radius:10px;padding:12px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;font-weight:700;background:#e7edf5;color:#10151c;cursor:pointer}.muted{font-size:12px;color:#788697;margin-top:18px}.err{color:#ff8e8e;margin-top:12px}</style></head><body><main class="wrap"><div class="brand">AMARKTAI EARN</div><div class="sub">Autonomous Economic Operations</div><section class="card"><h2>Secure Owner Access</h2><div id="login"><label>Email / Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button onclick="login()">Secure Sign In</button></div><div id="totp" hidden><h3>Two-Factor Authentication</h3><label>6-digit authenticator code</label><input id="c" inputmode="numeric" autocomplete="one-time-code"><button onclick="verify(false)">Verify</button><button onclick="verify(true)">Use recovery code</button></div><div id="e" class="err"></div><div class="muted">Secure connection required · No public registration · Financial values remain hidden until authentication.</div></section></main>
<script>function ck(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}async function post(url,body){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':decodeURIComponent(ck('csrftoken'))},credentials:'same-origin',body:JSON.stringify(body)})}async function login(){await fetch('/api/auth/csrf',{credentials:'same-origin'});let r=await post('/api/auth/login',{username:u.value,password:p.value});let j=await r.json();if(r.ok){login.hidden=true;totp.hidden=false;e.textContent=''}else e.textContent=j.message||j.error}async function verify(recovery){let r=await post('/api/auth/totp',{code:c.value,recovery});let j=await r.json();if(r.ok) location='/'; else e.textContent=j.error}</script></body></html>
