<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amarktai Earn · {{ section|title }}</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--panel2:#0d131b;--line:#222e3b;--text:#e8eef6;--muted:#8391a3;--good:#76d49b;--warn:#f6c76c;--bad:#ff7e86;--accent:#8ab4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0b1017;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:850;letter-spacing:.08em;padding:4px 10px 18px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;margin-top:5px}.nav a{display:block;color:#9cabbc;text-decoration:none;padding:10px 11px;border-radius:9px;margin:2px 0;text-transform:capitalize}.nav a:hover,.nav a.active{background:#16202b;color:white}.main{min-width:0}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:24px 28px;border-bottom:1px solid var(--line);background:rgba(8,11,16,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}h1{font-size:22px;margin:0;text-transform:capitalize}.mode{border:1px solid #2b4e3c;background:#122019;color:var(--good);padding:6px 10px;border-radius:999px;font-size:12px}.content{padding:24px 28px 50px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px}.card .label{font-size:11px;color:var(--muted);letter-spacing:.06em}.card .value{font-size:22px;font-weight:800;margin-top:7px}.truth{font-size:11px;color:#687789;margin-top:5px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}.panel-title{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:750}.table-wrap{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #1c2631;vertical-align:top}th{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;position:sticky;top:0;background:var(--panel2)}td{font-size:12px;max-width:420px;overflow-wrap:anywhere}.empty{padding:28px;color:var(--muted)}pre{white-space:pre-wrap;margin:0;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#b9c5d2}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.meta{color:var(--muted);font-size:12px;margin-bottom:18px;display:flex;gap:18px;flex-wrap:wrap}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.head{position:static}.content,.head{padding-left:16px;padding-right:16px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">AMARKTAI EARN<small>ECONOMIC OPERATIONS</small></div><nav class="nav">
{% for item in sections %}<a href="{% if item == 'overview' %}/{% else %}/ops/{{ item }}/{% endif %}" class="{% if item == section %}active{% endif %}">{{ item|cut:"-"|title }}</a>{% endfor %}
</nav></aside><main class="main"><header class="head"><div><h1>{{ section|cut:"-" }}</h1></div><div class="mode" id="mode">LIVE DATA</div></header><div class="content"><div id="meta" class="meta"></div><div id="cards" class="cards"></div><div class="panel"><div class="panel-title" id="tableTitle">{{ section|title }}</div><div id="primary"></div></div><div class="panel" id="secondaryPanel" style="display:none"><div class="panel-title">Additional detail</div><div id="secondary"></div></div></div></main></div>
<script>
const section="{{ section|escapejs }}";
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scalar(v){if(v===null||v===undefined)return '—';if(typeof v==='object')return '<pre>'+esc(JSON.stringify(v,null,2))+'</pre>';return esc(v)}
function renderCards(cards){const el=document.getElementById('cards');el.innerHTML=(cards||[]).map(c=>`<div class="card"><div class="label">${esc(c.label)}</div><div class="value">${esc(c.value)}</div>${c.truth?`<div class="truth">${esc(c.truth)}</div>`:''}</div>`).join('')}
function renderTable(target,rows){const el=document.getElementById(target);if(!rows||!rows.length){el.innerHTML='<div class="empty">No real records yet.</div>';return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];el.innerHTML='<div class="table-wrap"><table><thead><tr>'+keys.map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>`<td>${scalar(r[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}
fetch('/api/ops/{{ section }}',{credentials:'same-origin'}).then(async r=>{if(r.status===401){location='/login/';return}const d=await r.json();renderCards(d.cards);renderTable('primary',d.rows);if(d.secondary_rows){secondaryPanel.style.display='block';renderTable('secondary',d.secondary_rows)}const meta=d.meta||{};document.getElementById('meta').innerHTML=Object.entries(meta).map(([k,v])=>`<span><b>${esc(k.replaceAll('_',' '))}:</b> ${scalar(v)}</span>`).join('');if(meta.autonomous_mode)mode.textContent='MODE '+meta.autonomous_mode}).catch(e=>{document.getElementById('primary').innerHTML='<div class="empty bad">Dashboard API failed: '+esc(e.name)+'</div>'})
</script></body></html>
