{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>AmarktAI Earn · Markets</title>
  <link rel="stylesheet" href="{% static 'control/app.css' %}">
  <link rel="stylesheet" href="{% static 'control/markets.css' %}">
</head>
<body>
  <div class="aurora aurora-one" aria-hidden="true"></div>
  <div class="aurora aurora-two" aria-hidden="true"></div>
  <div class="app-shell">
    {% include "control/partials/sidebar.html" %}
    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
    <main class="app-main">
      <header class="app-header">
        <div class="header-leading">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <div>
            <div class="breadcrumb">AMARKTAI EARN <span>/</span> MARKETS</div>
            <h1>Markets</h1>
            <p>Only owner-usable earning routes belong here; readiness, payout and autonomy remain separate proof gates</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="live-state" id="liveState" aria-label="Markets data status"><i></i><span>Connecting data</span></div>
          <div class="updated-state">Updated <time id="lastUpdated">—</time></div>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh markets data">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 9a7 7 0 0 1 11.6-2L20 9M4 15l2.3 2A7 7 0 0 0 18 15"/></svg>
          </button>
        </div>
      </header>
      <div class="page-content markets-page" id="marketsPage" data-section="markets">
        <div class="page-skeleton" id="pageSkeleton" aria-label="Loading markets dashboard">
          <div class="skeleton skeleton-hero"></div>
          <div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
          <div class="skeleton skeleton-panel"></div>
        </div>
        <div id="marketsRoot" hidden></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{% static 'control/markets.js' %}" defer></script>
</body>
</html>
