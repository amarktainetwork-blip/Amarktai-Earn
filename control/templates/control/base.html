{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Amarktai Earn · {{ page_title }}</title>
  <link rel="stylesheet" href="{% static 'control/app.css' %}">
</head>
<body>
  <div class="aurora aurora-one" aria-hidden="true"></div>
  <div class="aurora aurora-two" aria-hidden="true"></div>
  <div class="app-shell">
    {% include "control/partials/sidebar.html" %}
    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
    <main class="app-main">
      <header class="app-header">
        <div class="header-leading">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <div>
            <div class="breadcrumb">AMARKTAI EARN <span>/</span> {% if advanced_section %}SYSTEM <span>/</span> {% endif %}{{ page_title|upper }}</div>
            <h1>{{ page_title }}</h1>
            <p>{{ page_description }}</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="live-state" id="liveState" aria-label="Dashboard data status"><i></i><span>Connecting data</span></div>
          <div class="updated-state">Updated <time id="lastUpdated">—</time></div>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh dashboard">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 9a7 7 0 0 1 11.6-2L20 9M4 15l2.3 2A7 7 0 0 0 18 15"/></svg>
          </button>
        </div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{% static 'control/app.js' %}" defer></script>
</body>
</html>
